[package]
name = "adeploy"
version = "0.1.3"
edition = "2021"

[dependencies]
# Core dependencies
tonic = { version = "0.14", features = ["tls-ring"] }
prost = "0.14"
clap = { version = "4.5", features = ["derive"] }
# Only what the code reaches for: the runtime, the hook child processes, the
# staging file, and the channels and timers the deployment loop is built from.
tokio = { version = "1.47", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
log2 = "0.2.2"
tonic-prost = "0.14"

# Auxiliary dependencies
tar = "0.4"
flate2 = "1.1"
uuid = { version = "1.18", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tokio-stream = "0.1"
async-stream = "0.3"
thiserror = "2.0"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
service-manager = "0.8"
hostname = "0.4"
# The client builds its archive into a temporary file rather than memory.
tempfile = "3.23"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.6"
windows-sys = { version = "0.52", features = ["Win32_Foundation"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio-test = "0.4"

# Release binaries are downloaded and copied to servers, so their size is part
# of what this tool costs to use. 10.0MB -> 5.5MB.
[profile.release]
# Symbol names are two megabytes of the ten this used to be, and nothing reads
# them: a panic reports its own message, and the backtrace behind it is not
# something a deployment log is any use for.
strip = true
# The largest win, and the reason `codegen-units` is here too. Without it the
# same function is emitted into several codegen units and every copy is kept -
# three copies of `client::pair`'s state machine, at 22KiB each, were in the
# binary. Thin LTO does not collapse them and came out slightly *larger* than
# no LTO at all, so this has to be "fat".
#
# It costs build time: a rebuild after a one-line change goes from 6s to 38s.
# Only `--release` pays that, so day-to-day `cargo build` and `cargo test` are
# untouched; CI pays it once per platform when a release is cut.
lto = "fat"
codegen-units = 1
# Deliberately left at the default. `opt-level = "s"` would take another 1.3MB
# but costs about 10% on everything that compresses or hashes, at every package
# size measured - and that is the work a deployment is made of.
#
# Also deliberately not `panic = "abort"`, which would save 0.7MB by dropping
# the unwinding tables. Aborting runs no destructors, and the destructors are
# where a hook gets killed, a staged upload is removed, and an unfinished
# deployment is cleaned up.
