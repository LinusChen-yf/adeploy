[package]
name = "adeploy"
version = "0.2.0"
edition = "2021"

[dependencies]
# Core dependencies
tonic = { version = "0.14", features = ["tls-ring"] }
prost = "0.14"
clap = { version = "4.5", features = ["derive"] }
# Only what the code reaches for: the runtime, the hook child processes, the
# staging file, and the channels and timers the deployment loop is built from.
tokio = { version = "1.47", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
log2 = "0.2.2"
tonic-prost = "0.14"

# Auxiliary dependencies
tar = "0.4"
flate2 = "1.1"
uuid = { version = "1.18", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tokio-stream = "0.1"
async-stream = "0.3"
thiserror = "2.0"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
service-manager = "0.8"
hostname = "0.4"
# The client builds its archive into a temporary file rather than memory.
tempfile = "3.23"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.6"
windows-sys = { version = "0.52", features = ["Win32_Foundation"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
# Symbol names nothing reads.
strip = true
# Collapses the duplicate copies of a function that separate codegen units each
# keep. Costs build time, which only `--release` pays.
lto = "fat"
codegen-units = 1
