syntax = "proto3";

package adeploy;

// Deploy service definition
service DeployService {
    // Ask a server to trust this client's key.
    //
    // The only method that cannot require a key, since establishing one is the
    // point. A request proves possession of the key it presents and is queued
    // for a human to approve; nothing is trusted until they do.
    rpc Pair(PairRequest) returns (PairResponse);

    // The client opens with a DeployStart describing what it wants to send and
    // proving who it is, then streams the archive in chunks. The server answers
    // with live progress and a final result.
    //
    // Splitting the description from the payload means the key check runs on a
    // small message: an unauthorised caller never gets to send a byte of
    // archive, and the server decides whether to accept a transfer before
    // committing memory or disk to it.
    rpc Deploy(stream DeployChunk) returns (stream DeployEvent);

    // What snapshots a package has to go back to.
    rpc ListBackups(BackupListRequest) returns (BackupListResponse);

    // Put one of those snapshots back, running the same hooks a deploy does.
    rpc Rollback(RollbackRequest) returns (stream DeployEvent);
}

// One message in the upload stream.
message DeployChunk {
    oneof payload {
        // Exactly the first message of the stream.
        DeployStart start = 1;
        // Every subsequent message: a slice of the archive, in order.
        bytes data = 2;
    }
}

// Opening message: what is about to be sent, and who is sending it.
message DeployStart {
    string package_name = 1;
    // Size of the whole archive. Advisory: the server still counts what it
    // actually receives and aborts a stream that exceeds this.
    uint64 total_size = 2;
    // SHA256 of the whole archive, verified once the last chunk arrives.
    string file_hash = 3;
    // Base64 Ed25519 public key of the client.
    string public_key = 4;
    // Random per-request value; the server refuses a nonce it has seen.
    string nonce = 5;
    // Unix milliseconds. Bounds how long a captured request stays replayable
    // and lets the server forget old nonces.
    int64 timestamp_ms = 6;
    // Seconds the server may spend deploying, measured from the moment the last
    // byte arrives. Carried here rather than as a gRPC deadline because that is
    // absolute from the start of the request, and so would have to cover the
    // upload as well.
    //
    // The upload itself is not bounded here. A broken connection surfaces as a
    // transport error, and a silently dead one is caught by HTTP/2 keepalive,
    // which needs no value tuned per package or per link.
    uint64 deploy_timeout_secs = 9;
    // Base64 Ed25519 signature over fields 1-6 and 9.
    //
    // Covering the description rather than only the bytes binds the archive to
    // the package it was meant for, so a captured request cannot be replayed
    // against a different package's path and hooks.
    string signature = 7;
}

// Server-to-client event stream.
message DeployEvent {
    oneof event {
        // Sent once the opening message is accepted; the client starts sending.
        DeployAccepted accepted = 1;
        // Emitted as the deployment progresses, rather than batched at the end.
        DeployLog log = 2;
        // Final outcome, always the last event.
        DeployResult result = 3;
    }
}

message DeployAccepted {
    string deploy_id = 1;
}

message DeployResult {
    bool success = 1;
    string message = 2;
    string deploy_id = 3;
}

message DeployLog {
    enum Level {
        LEVEL_UNSPECIFIED = 0;
        INFO = 1;
        WARN = 2;
        ERROR = 3;
    }
    Level level = 1;
    string message = 2;
}

// Ask to be trusted by a server.
message PairRequest {
    // Base64 Ed25519 public key the client wants approved.
    string public_key = 1;
    // Name the operator will see in the pending list, usually the hostname.
    string client_name = 2;
    string nonce = 3;
    int64 timestamp_ms = 4;
    // Base64 Ed25519 signature over fields 1-4, made with the key in field 1.
    //
    // Self-signed: it proves the sender holds the key it is asking to have
    // approved, so nobody can fill an operator's queue with keys they do not
    // control.
    string signature = 5;
}

message PairResponse {
    PairState state = 1;
    // Server's view of the key, for the operator to compare against the
    // client's own output before approving.
    string fingerprint = 2;
    string message = 3;
}

enum PairState {
    PAIR_STATE_UNSPECIFIED = 0;
    // Queued, waiting for someone to run `adeploy server approve`.
    PAIR_STATE_PENDING = 1;
    // Already trusted; the client can deploy.
    PAIR_STATE_APPROVED = 2;
    // Explicitly refused by an operator.
    PAIR_STATE_REJECTED = 3;
}

// Ask which snapshots exist for a package.
message BackupListRequest {
    string package_name = 1;
    string public_key = 2;
    string nonce = 3;
    int64 timestamp_ms = 4;
    // Base64 Ed25519 signature over fields 1-4.
    string signature = 5;
}

message BackupListResponse {
    // Newest first.
    repeated BackupEntry backups = 1;
}

message BackupEntry {
    string name = 1;
    int64 created_ms = 2;
    uint64 size_bytes = 3;
}

// Put a snapshot back in place.
message RollbackRequest {
    string package_name = 1;
    // Which snapshot, by name. Empty means the most recent one.
    string backup_name = 2;
    string public_key = 3;
    string nonce = 4;
    int64 timestamp_ms = 5;
    // Seconds the server may spend restoring. There is nothing to upload, so
    // this starts as soon as the request is accepted.
    uint64 deploy_timeout_secs = 7;
    // Base64 Ed25519 signature over fields 1-5 and 7.
    string signature = 6;
}
